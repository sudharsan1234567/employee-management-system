<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - Employee Management'">Employee Management</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:fragment="sidebar(activeMenu)" class="sidebar">
    <div class="sidebar-header">
        <i class="bi bi-buildings-fill fs-3 text-primary"></i>
        <h4 class="mb-0 ms-2 fw-bold text-white">EMS Pro</h4>
    </div>
    <ul class="nav flex-column mt-4">
        <!-- ADMIN NAVIGATION -->
        <th:block sec:authorize="hasRole('ADMIN')">
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activeMenu == 'dashboard' ? 'active' : ''}" th:href="@{/dashboard}">
                    <i class="bi bi-speedometer2 me-2"></i> Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activeMenu == 'employees' ? 'active' : ''}" th:href="@{/employees}">
                    <i class="bi bi-people me-2"></i> Employees
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activeMenu == 'departments' ? 'active' : ''}" th:href="@{/departments}">
                    <i class="bi bi-diagram-3 me-2"></i> Departments
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activeMenu == 'attendance' ? 'active' : ''}" th:href="@{/attendance}">
                    <i class="bi bi-calendar-check me-2"></i> Attendance
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activeMenu == 'leave' ? 'active' : ''}" th:href="@{/leave}">
                    <i class="bi bi-calendar2-week me-2"></i> Leave Management
                </a>
            </li>
        </th:block>

        <!-- EMPLOYEE NAVIGATION -->
        <th:block sec:authorize="hasRole('EMPLOYEE')">
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activeMenu == 'emp-dashboard' ? 'active' : ''}" th:href="@{/employee/dashboard}">
                    <i class="bi bi-speedometer2 me-2"></i> Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activeMenu == 'emp-profile' ? 'active' : ''}" th:href="@{/employee/profile}">
                    <i class="bi bi-person-badge me-2"></i> My Profile
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activeMenu == 'emp-attendance' ? 'active' : ''}" th:href="@{/employee/attendance}">
                    <i class="bi bi-calendar-check me-2"></i> My Attendance
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activeMenu == 'my-leaves' ? 'active' : ''}" th:href="@{/employee/leave}">
                    <i class="bi bi-calendar2-week me-2"></i> My Leaves
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activeMenu == 'emp-password' ? 'active' : ''}" th:href="@{/employee/change-password}">
                    <i class="bi bi-key me-2"></i> Change Password
                </a>
            </li>
        </th:block>
    </ul>
    <div class="sidebar-footer mt-auto p-3">
        <div class="d-flex align-items-center mb-3">
            <div class="avatar bg-primary text-white rounded-circle d-flex align-items-center justify-content-center fw-bold me-2" style="width:40px; height:40px;">
                <span th:text="${#strings.substring(#authentication.name, 0, 1).toUpperCase()}">U</span>
            </div>
            <div>
                <div class="fw-semibold text-white" th:text="${#authentication.name}">Username</div>
                <div class="text-white-50 small" sec:authentication="principal.authorities">Role</div>
            </div>
        </div>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-outline-light w-100 btn-sm">
                <i class="bi bi-box-arrow-right me-1"></i> Logout
            </button>
        </form>
    </div>
</div>

<div th:fragment="navbar" class="top-navbar d-md-none p-3 d-flex justify-content-between align-items-center bg-dark text-white">
    <div class="d-flex align-items-center">
        <i class="bi bi-buildings-fill fs-4 text-primary"></i>
        <h5 class="mb-0 ms-2 fw-bold">EMS Pro</h5>
    </div>
    <button class="btn btn-link text-white p-0" type="button" id="mobileMenuBtn">
        <i class="bi bi-list fs-2"></i>
    </button>
</div>

<div th:fragment="alerts" class="alerts-container">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
</div>

<th:block th:fragment="scripts">
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script th:src="@{/js/app.js}"></script>
</th:block>

</body>
</html>
