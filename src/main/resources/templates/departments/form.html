<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${departmentForm.id == null ? 'Add Department' : 'Edit Department'})}"></head>
<body>

<div th:replace="~{fragments/layout :: sidebar('departments')}"></div>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="main-wrapper">
    <div class="content-header">
        <h2 class="fw-bold mb-0" th:text="${departmentForm.id == null ? 'Add New Department' : 'Edit Department'}">Add Department</h2>
        <p class="text-muted mb-0">Manage department details.</p>
    </div>

    <div class="page-content">
        <div th:replace="~{fragments/layout :: alerts}"></div>

        <div class="row g-4">
            <div class="col-12 col-xl-8 mx-auto">
                <div class="form-card">
                    <form th:action="${departmentForm.id == null} ? '/departments' : '/departments/' + ${departmentForm.id}"
                          th:object="${departmentForm}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        
                        <div class="mb-4">
                            <label class="form-label required">Department Name</label>
                            <input type="text" class="form-control" th:field="*{name}" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''" placeholder="e.g. Human Resources">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" th:field="*{description}" th:classappend="${#fields.hasErrors('description')} ? 'is-invalid' : ''" rows="4" placeholder="Brief description of the department's function..."></textarea>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                            <a th:href="@{/departments}" class="btn btn-light px-4">Cancel</a>
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-save me-1"></i> Save Department
                            </button>
                        </div>
                    </form>
                </div>
                
                <div class="card-table mt-4" th:if="${employees != null and !employees.isEmpty()}">
                    <div class="p-4 border-bottom">
                        <h6 class="fw-bold mb-0">Employees in this Department</h6>
                    </div>
                    <div class="list-group list-group-flush">
                        <div th:each="emp : ${employees}" class="list-group-item p-3 d-flex justify-content-between align-items-center">
                            <div>
                                <div class="fw-semibold text-dark" th:text="${emp.firstName + ' ' + emp.lastName}">Name</div>
                                <div class="small text-muted" th:text="${emp.jobTitle}">Job Title</div>
                            </div>
                            <span class="badge rounded-pill px-3 py-1" 
                                  th:classappend="'badge-' + ${#strings.toLowerCase(emp.status)}"
                                  th:text="${emp.status}">Status</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .form-label.required::after {
        content: " *";
        color: var(--danger-color);
    }
</style>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
