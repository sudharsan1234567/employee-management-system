<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Leave Management')}"></head>
<body>

<div th:replace="~{fragments/layout :: sidebar('leave')}"></div>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="main-wrapper">
    <div class="content-header d-flex justify-content-between align-items-center">
        <div>
            <h2 class="fw-bold mb-0">Leave Management</h2>
            <p class="text-muted mb-0">Review and process employee leave requests.</p>
        </div>
    </div>

    <div class="page-content">
        <div th:replace="~{fragments/layout :: alerts}"></div>

        <div class="card-table">
            <div class="p-4 border-bottom d-flex justify-content-between align-items-center">
                <h5 class="fw-bold mb-0">All Leave Requests</h5>
                <span class="text-muted small" th:text="${#lists.size(leaves)} + ' Total'">0</span>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th>Employee</th>
                            <th>Leave Type</th>
                            <th>From</th>
                            <th>To</th>
                            <th>Days</th>
                            <th>Reason</th>
                            <th>Status</th>
                            <th>Applied On</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="leave : ${leaves}">
                            <td>
                                <div class="fw-semibold" th:text="${leave.employee.firstName + ' ' + leave.employee.lastName}">Name</div>
                                <div class="text-muted small" th:text="${leave.employee.employeeCode}">Code</div>
                            </td>
                            <td th:text="${leave.leaveType}">Type</td>
                            <td th:text="${#temporals.format(leave.fromDate, 'dd MMM yyyy')}">From</td>
                            <td th:text="${#temporals.format(leave.toDate, 'dd MMM yyyy')}">To</td>
                            <td th:text="${leave.toDate.toEpochDay() - leave.fromDate.toEpochDay() + 1}">1</td>
                            <td class="text-muted small" style="max-width:160px;" th:text="${leave.reason}">Reason</td>
                            <td>
                                <span class="badge rounded-pill px-3 py-1"
                                      th:classappend="${leave.status.name() == 'APPROVED' ? 'bg-success' :
                                                        leave.status.name() == 'REJECTED' ? 'bg-danger' : 'bg-warning text-dark'}"
                                      th:text="${leave.status}">PENDING</span>
                            </td>
                            <td class="text-muted small" th:text="${leave.appliedAt != null ? #temporals.format(leave.appliedAt, 'dd MMM yyyy') : ''}">Date</td>
                            <td>
                                <!-- Only show actions for PENDING requests -->
                                <div th:if="${leave.status.name() == 'PENDING'}">
                                    <!-- Approve form -->
                                    <form th:action="@{/leave/{id}/approve(id=${leave.id})}" method="post" class="d-inline">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <div class="input-group input-group-sm mb-1" style="min-width:220px;">
                                            <input type="text" name="adminResponse" class="form-control form-control-sm"
                                                   placeholder="Response (optional)">
                                            <button type="submit" class="btn btn-success btn-sm">
                                                <i class="bi bi-check-lg"></i> Approve
                                            </button>
                                        </div>
                                    </form>
                                    <!-- Reject form -->
                                    <form th:action="@{/leave/{id}/reject(id=${leave.id})}" method="post" class="d-inline">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <div class="input-group input-group-sm">
                                            <input type="text" name="adminResponse" class="form-control form-control-sm"
                                                   placeholder="Reason (optional)">
                                            <button type="submit" class="btn btn-danger btn-sm">
                                                <i class="bi bi-x-lg"></i> Reject
                                            </button>
                                        </div>
                                    </form>
                                </div>
                                <!-- For processed requests show the admin response -->
                                <div th:if="${leave.status.name() != 'PENDING'}">
                                    <span class="text-muted small fst-italic"
                                          th:text="${leave.adminResponse != null and !leave.adminResponse.isEmpty() ? leave.adminResponse : '—'}">—</span>
                                    <div class="text-muted" style="font-size:0.75rem;" th:if="${leave.respondedAt != null}"
                                         th:text="'On ' + ${#temporals.format(leave.respondedAt, 'dd MMM yyyy')}">Date</div>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(leaves)}">
                            <td colspan="9" class="text-center py-5 text-muted">
                                <i class="bi bi-inbox fs-1 d-block mb-3"></i>
                                <h5>No leave requests</h5>
                                <p class="mb-0">No leave requests have been submitted yet.</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
