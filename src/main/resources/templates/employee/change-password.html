<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Change Password')}"></head>
<body>

<div th:replace="~{fragments/layout :: sidebar('emp-password')}"></div>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="main-wrapper">
    <div class="content-header">
        <h2 class="fw-bold mb-0">Change Password</h2>
        <p class="text-muted mb-0">Manage your portal security and login credentials</p>
    </div>

    <div class="page-content">
        <div th:replace="~{fragments/layout :: alerts}"></div>

        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card-table p-4">
                    <div class="text-center mb-4">
                        <div class="avatar bg-primary bg-opacity-10 text-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-2" style="width:60px; height:60px;">
                            <i class="bi bi-shield-lock-fill fs-2"></i>
                        </div>
                        <h4 class="fw-bold">Update Your Password</h4>
                        <p class="text-muted small">Choose a strong password to protect your employee account.</p>
                    </div>

                    <form th:action="@{/employee/change-password}" th:object="${changePasswordForm}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Current Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" th:field="*{currentPassword}" placeholder="Enter current password" required autofocus>
                            </div>
                            <div th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}" class="text-danger small mt-1"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">New Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-key"></i></span>
                                <input type="password" class="form-control" th:field="*{newPassword}" placeholder="Minimum 6 characters" required>
                            </div>
                            <div th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}" class="text-danger small mt-1"></div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Confirm New Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-check2-circle"></i></span>
                                <input type="password" class="form-control" th:field="*{confirmPassword}" placeholder="Re-enter new password" required>
                            </div>
                            <div th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="text-danger small mt-1"></div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="bi bi-check-lg me-1"></i> Update Password
                            </button>
                            <a th:href="@{/employee/dashboard}" class="btn btn-light">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
