<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My Attendance')}"></head>
<body>

<div th:replace="~{fragments/layout :: sidebar('emp-attendance')}"></div>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="main-wrapper">
    <div class="content-header d-flex flex-column flex-md-row justify-content-between align-items-md-center">
        <div>
            <h2 class="fw-bold mb-0">My Attendance History</h2>
            <p class="text-muted mb-0">Review your daily working hours, check-in, and check-out logs</p>
        </div>

        <div class="mt-3 mt-md-0 d-flex gap-2">
            <!-- Check In Button -->
            <form th:if="${todayAttendance == null}" th:action="@{/employee/attendance/check-in}" method="post" class="d-inline">
                <button type="submit" class="btn btn-success shadow-sm">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Check In Today
                </button>
            </form>

            <!-- Check Out Button -->
            <form th:if="${todayAttendance != null and todayAttendance.checkOut == null}" th:action="@{/employee/attendance/check-out}" method="post" class="d-inline">
                <button type="submit" class="btn btn-danger shadow-sm">
                    <i class="bi bi-box-arrow-right me-1"></i> Check Out
                </button>
            </form>

            <!-- Already Completed -->
            <span th:if="${todayAttendance != null and todayAttendance.checkOut != null}" class="badge bg-success py-2 px-3 fs-6 d-flex align-items-center">
                <i class="bi bi-check-circle-fill me-1"></i> Day Completed
            </span>
        </div>
    </div>

    <div class="page-content">
        <div th:replace="~{fragments/layout :: alerts}"></div>

        <!-- Attendance Table -->
        <div class="card-table">
            <div class="p-4 border-bottom d-flex justify-content-between align-items-center">
                <h5 class="fw-bold mb-0">Attendance Log</h5>
                <span class="text-muted small" th:text="${#lists.size(attendanceList)} + ' Total Records'">0 Records</span>
            </div>

            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Check-In Time</th>
                            <th>Check-Out Time</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="att : ${attendanceList}">
                            <td class="fw-semibold">
                                <i class="bi bi-calendar3 me-1 text-muted"></i>
                                <span th:text="${#temporals.format(att.attendanceDate, 'EEEE, MMM d, yyyy')}">Date</span>
                            </td>
                            <td>
                                <span th:if="${att.checkIn != null}" class="text-success fw-semibold">
                                    <i class="bi bi-clock me-1"></i>
                                    <span th:text="${#temporals.format(att.checkIn, 'hh:mm:ss a')}">09:00:00 AM</span>
                                </span>
                                <span th:if="${att.checkIn == null}" class="text-muted">--</span>
                            </td>
                            <td>
                                <span th:if="${att.checkOut != null}" class="text-danger fw-semibold">
                                    <i class="bi bi-clock-history me-1"></i>
                                    <span th:text="${#temporals.format(att.checkOut, 'hh:mm:ss a')}">05:30:00 PM</span>
                                </span>
                                <span th:if="${att.checkOut == null}" class="text-muted">--</span>
                            </td>
                            <td>
                                <span class="badge rounded-pill px-3 py-1"
                                      th:classappend="${att.status.name() == 'PRESENT' ? 'bg-success' : (att.status.name() == 'LATE' ? 'bg-warning text-dark' : 'bg-secondary')}"
                                      th:text="${att.status}">PRESENT</span>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(attendanceList)}">
                            <td colspan="4" class="text-center py-5 text-muted">
                                <i class="bi bi-calendar-x fs-1 d-block mb-3"></i>
                                <h5>No attendance records yet</h5>
                                <p class="mb-0">Your daily check-in and check-out logs will be recorded here.</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
