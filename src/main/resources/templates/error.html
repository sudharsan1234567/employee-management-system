<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - EMS Pro</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8fafc; font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">
    <div class="text-center p-5">
        <i class="bi bi-exclamation-octagon text-danger mb-4" style="font-size: 5rem;"></i>
        <h1 class="fw-bold text-dark mb-3">Oops! Something went wrong.</h1>
        <p class="text-muted mb-4 fs-5">We're sorry, but an unexpected error occurred.</p>
        
        <a th:href="@{/dashboard}" class="btn btn-primary btn-lg px-4 shadow-sm">
            <i class="bi bi-house-door me-1"></i> Return to Dashboard
        </a>
    </div>
</body>
</html>
