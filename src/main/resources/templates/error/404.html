<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('404 Not Found')}"></head>
<body>

<div th:replace="~{fragments/layout :: sidebar('none')}"></div>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="main-wrapper bg-light d-flex align-items-center justify-content-center">
    <div class="text-center p-5">
        <i class="bi bi-search text-muted mb-4" style="font-size: 5rem;"></i>
        <h1 class="display-4 fw-bold text-dark mb-3">404</h1>
        <h3 class="fw-semibold text-muted mb-4">Page Not Found</h3>
        
        <div class="alert alert-warning d-inline-block text-start mb-4 shadow-sm" th:if="${errorMessage}">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${errorMessage}">The requested resource could not be found.</span>
        </div>
        <p class="text-muted mb-4" th:unless="${errorMessage}">The page you are looking for doesn't exist or has been moved.</p>
        
        <div>
            <a th:href="@{/dashboard}" class="btn btn-primary px-4 me-2">
                <i class="bi bi-house-door me-1"></i> Dashboard
            </a>
            <a th:href="@{/employees}" class="btn btn-outline-secondary px-4">
                <i class="bi bi-people me-1"></i> Employees
            </a>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
