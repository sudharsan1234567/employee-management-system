<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Access Denied')}"></head>
<body>

<div th:replace="~{fragments/layout :: sidebar('none')}"></div>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="main-wrapper d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="text-center p-5" style="max-width: 560px;">
        <div class="mb-4">
            <i class="bi bi-shield-lock-fill text-warning" style="font-size: 5rem;"></i>
        </div>
        <h1 class="fw-bold text-dark mb-2" style="font-size: 3rem;">403</h1>
        <h3 class="fw-semibold text-muted mb-3">Access Denied</h3>
        <p class="text-muted mb-4 fs-5">
            You don't have permission to access this page.
            This area is restricted to administrators only.
        </p>
        <div class="d-flex gap-3 justify-content-center">
            <a th:href="@{/dashboard}" class="btn btn-primary px-4">
                <i class="bi bi-house-door me-1"></i> Dashboard
            </a>
            <a th:href="@{/employees}" class="btn btn-outline-secondary px-4">
                <i class="bi bi-people me-1"></i> Employees
            </a>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
