<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Server Error')}"></head>
<body>

<div th:replace="~{fragments/layout :: sidebar('none')}"></div>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="main-wrapper d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="text-center p-5" style="max-width: 560px;">
        <div class="mb-4">
            <i class="bi bi-exclamation-octagon-fill text-danger" style="font-size: 5rem;"></i>
        </div>
        <h1 class="fw-bold text-dark mb-2" style="font-size: 3rem;">500</h1>
        <h3 class="fw-semibold text-muted mb-3">Server Error</h3>

        <div class="alert alert-danger d-inline-block text-start mb-4 shadow-sm" th:if="${errorMessage}">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${errorMessage}">An error occurred.</span>
        </div>
        <p class="text-muted mb-4" th:unless="${errorMessage}">
            Something went wrong on our end. Please try again later.
        </p>

        <div class="d-flex gap-3 justify-content-center">
            <a th:href="@{/dashboard}" class="btn btn-primary px-4">
                <i class="bi bi-house-door me-1"></i> Dashboard
            </a>
            <a th:href="@{/employees}" class="btn btn-outline-secondary px-4">
                <i class="bi bi-people me-1"></i> Employees
            </a>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
